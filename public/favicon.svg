<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Cap -->
  <rect x="3" y="1" width="10" height="1" fill="#E52521"/>
  <rect x="2" y="2" width="12" height="1" fill="#E52521"/>
  <rect x="1" y="3" width="13" height="1" fill="#E52521"/>
  <rect x="0" y="4" width="15" height="1" fill="#E52521"/>
  <!-- Cap brim -->
  <rect x="0" y="5" width="16" height="1" fill="#E52521"/>
  <!-- Badge (yellow circle on cap) -->
  <rect x="7" y="3" width="2" height="2" fill="#FBD000"/>
  <!-- Hair/Sideburns -->
  <rect x="1" y="6" width="2" height="2" fill="#6B3300"/>
  <rect x="13" y="6" width="2" height="1" fill="#6B3300"/>
  <!-- Face -->
  <rect x="3" y="6" width="10" height="1" fill="#FCA044"/>
  <rect x="3" y="7" width="10" height="1" fill="#FCA044"/>
  <rect x="1" y="8" width="14" height="1" fill="#FCA044"/>
  <rect x="1" y="9" width="14" height="1" fill="#FCA044"/>
  <rect x="1" y="10" width="14" height="1" fill="#FCA044"/>
  <!-- Eyes -->
  <rect x="5" y="7" width="2" height="2" fill="#6B3300"/>
  <rect x="9" y="7" width="2" height="2" fill="#6B3300"/>
  <!-- Nose -->
  <rect x="7" y="9" width="2" height="1" fill="#FCA044"/>
  <!-- Mustache -->
  <rect x="4" y="10" width="8" height="1" fill="#6B3300"/>
  <rect x="3" y="11" width="3" height="1" fill="#6B3300"/>
  <rect x="10" y="11" width="3" height="1" fill="#6B3300"/>
  <rect x="5" y="11" width="6" height="1" fill="#6B3300"/>
  <!-- Mouth/Chin -->
  <rect x="1" y="11" width="2" height="1" fill="#FCA044"/>
  <rect x="13" y="11" width="2" height="1" fill="#FCA044"/>
  <rect x="1" y="12" width="14" height="1" fill="#FCA044"/>
  <rect x="1" y="13" width="14" height="1" fill="#FCA044"/>
  <!-- Overalls hint -->
  <rect x="3" y="14" width="4" height="2" fill="#049CD8"/>
  <rect x="9" y="14" width="4" height="2" fill="#049CD8"/>
  <rect x="7" y="14" width="2" height="2" fill="#FBD000"/>
</svg>